# One-click cloud deploy (free HTTPS URL, needed for the Android app and phone mics).
# Render asks for the two API keys during deploy; they are never stored in the repo.
services:
  - type: web
    name: kisan-mitra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GNANI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite,gemini-3.5-flash,gemini-flash-lite-latest,gemini-3.8-flash
